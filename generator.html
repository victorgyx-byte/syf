<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Create-your-jam - Loop Generator</title>
  <style>
    :root {
      --ink: #211527;
      --line: rgba(33, 21, 39, .15);
      --glass: rgba(255, 255, 255, .72);
      --shadow: 0 20px 44px rgba(49, 18, 84, .2);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: linear-gradient(135deg, #fff56a 0%, #ff8bd2 42%, #72f0ff 100%); color: var(--ink); }
    .app { max-width: 1180px; margin: 0 auto; padding: 18px; display: grid; gap: 14px; }
    .panel { border: 1px solid var(--line); border-radius: 22px; background: var(--glass); backdrop-filter: blur(16px); box-shadow: var(--shadow); padding: 16px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.8rem); line-height: .95; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { display: grid; place-items: center; min-height: 52px; border-radius: 16px; border: 1px solid rgba(33, 21, 39, .2); background: rgba(255,255,255,.6); color: var(--ink); font-weight: 700; text-decoration: none; }
    .btn.primary { background: rgba(255, 224, 61, .7); }
    .btn:active { transform: translateY(1px); }
    .input { width: 100%; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); padding: 0 12px; font: inherit; background: rgba(255,255,255,.75); }
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .preset { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.55); font-weight: 700; }
    .preset.active { outline: 3px solid rgba(0,213,255,.5); background: rgba(255,255,255,.85); }
    .preview { width: 100%; aspect-ratio: 16/9; border-radius: 18px; border: 1px solid var(--line); background: #fff; overflow: hidden; }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .draw-canvas { width: 100%; aspect-ratio: 16/9; border-radius: 18px; border: 1px solid var(--line); background: #fff; touch-action: none; display: block; }
    .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 10px; }
    .swatch { min-height: 30px; border-radius: 999px; border: 2px solid rgba(33,21,39,.2); }
    .swatch.active { outline: 3px solid rgba(0,213,255,.45); }
    .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .tool-btn { min-height: 34px; border-radius: 12px; border: 1px solid rgba(33,21,39,.2); background: rgba(255,255,255,.72); font-weight: 700; }
    .tool-btn.active { outline: 3px solid rgba(0,213,255,.45); }
    .note { margin: 0; font-size: .92rem; opacity: .8; }
    .workspace { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .col { display: grid; gap: 14px; align-content: start; min-width: 0; }
    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .row, .presets { grid-template-columns: 1fr; }
      .swatches { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Create<br>Loop Generator</h1>
      <p class="note">Upload a fruit drawing, auto-cut background, pick a motion style, and send it into Arrange.</p>
    </section>

    <div class="workspace">
      <div class="col">
        <section class="panel">
          <div class="row">
            <input class="input" id="loopTitle" value="My Fruit Loop" aria-label="Loop title">
            <label class="btn" for="photoInput">Upload fruit drawing</label>
          </div>
          <input id="photoInput" type="file" accept="image/*" style="display:none">
        </section>

        <section class="panel">
          <h3 style="margin:0 0 10px;">Draw your own fruit directly</h3>
          <div class="preview" style="padding:0;">
            <canvas class="draw-canvas" id="drawCanvas" width="960" height="540" aria-label="Draw your fruit"></canvas>
          </div>
          <div class="tools" aria-label="Drawing tools">
            <button class="tool-btn active" id="toolPencil" type="button">Pencil</button>
            <button class="tool-btn" id="toolFill" type="button">Fill</button>
            <button class="tool-btn" id="toolEraser" type="button">Eraser</button>
          </div>
          <div class="swatches" id="swatches" aria-label="Drawing colors">
            <button class="swatch active" data-color="#211527" style="background:#211527"></button>
            <button class="swatch" data-color="#ff4fa3" style="background:#ff4fa3"></button>
            <button class="swatch" data-color="#00d5ff" style="background:#00d5ff"></button>
            <button class="swatch" data-color="#54f06b" style="background:#54f06b"></button>
            <button class="swatch" data-color="#ffe03d" style="background:#ffe03d"></button>
            <button class="swatch" data-color="#6267ff" style="background:#6267ff"></button>
            <button class="swatch" data-color="#ff7a18" style="background:#ff7a18"></button>
            <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
          </div>
          <div class="row" style="margin-top:10px;">
            <button class="btn" id="clearDrawing" type="button">Clear drawing</button>
            <button class="btn" id="useDrawing" type="button">Use drawing</button>
          </div>
        </section>

        <section class="panel">
          <h3 style="margin:0 0 10px;">Fruit actions</h3>
          <div class="presets">
            <button class="preset active" data-preset="spin">Spin</button>
            <button class="preset" data-preset="rain">Rain</button>
            <button class="preset" data-preset="bounce">Bounce</button>
            <button class="preset" data-preset="smash">Smash</button>
            <button class="preset" data-preset="slingshot">Slingshot</button>
            <button class="preset" data-preset="orbit">Orbit</button>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="panel">
          <h3 style="margin:0 0 10px;">Generated preview/status</h3>
          <div class="preview" id="preview"></div>
          <p class="note" id="status">Upload an image to auto-detect and cut out the fruit.</p>
        </section>

        <section class="panel">
          <div class="row">
            <button class="btn primary" id="saveLoop">Add to Arrange</button>
            <a class="btn" href="./index.html">Back to Arrange</a>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const statusEl = document.getElementById("status");
    const titleEl = document.getElementById("loopTitle");
    const saveLoop = document.getElementById("saveLoop");
    const drawCanvas = document.getElementById("drawCanvas");
    const swatches = [...document.querySelectorAll(".swatch")];
    const toolButtons = {
      pencil: document.getElementById("toolPencil"),
      fill: document.getElementById("toolFill"),
      eraser: document.getElementById("toolEraser")
    };
    const clearDrawing = document.getElementById("clearDrawing");
    const useDrawing = document.getElementById("useDrawing");
    const presets = [...document.querySelectorAll(".preset")];

    let sourceImage = "";
    let sourceOriginal = "";
    let selectedPreset = "spin";
    let generatedSrc = "";
    let drawing = false;
    let drawTool = "pencil";
    let drawColor = "#211527";

    const drawCtx = drawCanvas.getContext("2d");
    drawCtx.fillStyle = "#ffffff";
    drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    drawCtx.strokeStyle = drawColor;
    drawCtx.lineWidth = 8;

    function setTool(nextTool) {
      drawTool = nextTool;
      Object.entries(toolButtons).forEach(([name, btn]) => {
        btn.classList.toggle("active", name === nextTool);
      });
    }

    toolButtons.pencil.addEventListener("click", () => setTool("pencil"));
    toolButtons.fill.addEventListener("click", () => setTool("fill"));
    toolButtons.eraser.addEventListener("click", () => setTool("eraser"));

    swatches.forEach((btn) => {
      btn.addEventListener("click", () => {
        swatches.forEach((s) => s.classList.remove("active"));
        btn.classList.add("active");
        drawColor = btn.dataset.color;
        if (drawTool === "pencil") drawCtx.strokeStyle = drawColor;
      });
    });

    function canvasPoint(event) {
      const rect = drawCanvas.getBoundingClientRect();
      const scaleX = drawCanvas.width / rect.width;
      const scaleY = drawCanvas.height / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
      };
    }

    drawCanvas.addEventListener("pointerdown", (event) => {
      const p = canvasPoint(event);
      if (drawTool === "fill") {
        drawCtx.fillStyle = drawColor;
        drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        return;
      }
      drawing = true;
      drawCtx.strokeStyle = drawTool === "eraser" ? "#ffffff" : drawColor;
      drawCtx.beginPath();
      drawCtx.moveTo(p.x, p.y);
      drawCanvas.setPointerCapture(event.pointerId);
    });

    drawCanvas.addEventListener("pointermove", (event) => {
      if (!drawing) return;
      const p = canvasPoint(event);
      drawCtx.lineTo(p.x, p.y);
      drawCtx.stroke();
    });

    function endDrawing() {
      drawing = false;
      drawCtx.closePath();
    }

    drawCanvas.addEventListener("pointerup", endDrawing);
    drawCanvas.addEventListener("pointercancel", endDrawing);

    clearDrawing.addEventListener("click", () => {
      drawCtx.fillStyle = "#ffffff";
      drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
      statusEl.textContent = "Drawing cleared.";
    });

    useDrawing.addEventListener("click", () => {
      sourceOriginal = drawCanvas.toDataURL("image/png");
      statusEl.textContent = "Using drawing. Detecting fruit and removing background...";
      removeBackgroundAuto(sourceOriginal)
        .then((cutout) => {
          sourceImage = cutout;
          updatePreview();
          statusEl.textContent = "Drawing applied.";
        })
        .catch(() => {
          sourceImage = sourceOriginal;
          updatePreview();
          statusEl.textContent = "Drawing applied (without auto-cut).";
        });
    });

    function makeLoopSvg(imageSrc, preset) {
      const style = {
        spin: {
          bg: "#00d5ff",
          motion: `<animateTransform attributeName="transform" type="rotate" values="0 400 225;370 400 225" dur="1.4s" repeatCount="indefinite"/>`
        },
        rain: {
          bg: "#6267ff",
          motion: `
            <g opacity=".7">
              <g>
                <animateTransform attributeName="transform" type="translate" values="-230 -260;-230 360" dur="1.1s" repeatCount="indefinite"/>
                <animateTransform attributeName="transform" type="scale" additive="sum" values=".38;.38" dur="1.1s" repeatCount="indefinite"/>
                <image href="${imageSrc}" x="280" y="105" width="240" height="240" preserveAspectRatio="xMidYMid slice"/>
              </g>
              <g>
                <animateTransform attributeName="transform" type="translate" values="-40 -300;-40 370" dur=".92s" begin=".12s" repeatCount="indefinite"/>
                <animateTransform attributeName="transform" type="scale" additive="sum" values=".5;.5" dur=".92s" begin=".12s" repeatCount="indefinite"/>
                <image href="${imageSrc}" x="280" y="105" width="240" height="240" preserveAspectRatio="xMidYMid slice"/>
              </g>
              <g>
                <animateTransform attributeName="transform" type="translate" values="160 -260;160 360" dur="1.24s" begin=".08s" repeatCount="indefinite"/>
                <animateTransform attributeName="transform" type="scale" additive="sum" values=".34;.34" dur="1.24s" begin=".08s" repeatCount="indefinite"/>
                <image href="${imageSrc}" x="280" y="105" width="240" height="240" preserveAspectRatio="xMidYMid slice"/>
              </g>
            </g>
            <g>
              <animateTransform attributeName="transform" type="translate" values="0 -240;0 300" dur=".86s" repeatCount="indefinite"/>
              <animateTransform attributeName="transform" type="scale" additive="sum" values=".72;.72" dur=".86s" repeatCount="indefinite"/>
              <image href="${imageSrc}" x="280" y="105" width="240" height="240" preserveAspectRatio="xMidYMid slice"/>
            </g>
            <g>
              <animateTransform attributeName="transform" type="translate" values="80 -300;80 360" dur=".98s" begin=".2s" repeatCount="indefinite"/>
              <animateTransform attributeName="transform" type="scale" additive="sum" values=".88;.88" dur=".98s" begin=".2s" repeatCount="indefinite"/>
              <image href="${imageSrc}" x="280" y="105" width="240" height="240" preserveAspectRatio="xMidYMid slice"/>
            </g>
          `
        },
        bounce: {
          bg: "#fff56a",
          motion: `
            <animateTransform attributeName="transform" type="translate" values="0 86;0 -68;0 86" dur="1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.52;1" keySplines=".2 .8 .2 1;.7 0 .2 1"/>
            <animateTransform attributeName="transform" type="scale" additive="sum" values="1.3 .66;.86 1.25;1.3 .66" dur="1.1s" repeatCount="indefinite"/>
          `
        },
        smash: {
          bg: "#ff8bd2",
          motion: `
            <animateTransform attributeName="transform" type="translate" values="0 130;0 -28;0 130" dur=".88s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="scale" additive="sum" values="1.62 .48;.72 1.48;1.62 .48" dur=".88s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="rotate" additive="sum" values="-8;10;-8" dur=".88s" repeatCount="indefinite"/>
          `
        },
        slingshot: {
          bg: "#54f06b",
          motion: `
            <animateTransform attributeName="transform" type="translate" values="-180 90;40 -24;260 -70;-180 90" dur="1.25s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.3;.66;1" keySplines=".05 .9 .1 1;.35 .75 .2 1;.6 0 .2 1"/>
            <animateTransform attributeName="transform" type="scale" additive="sum" values=".66 1.3;1.2 .85;1 .95;.66 1.3" dur="1.25s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="rotate" additive="sum" values="-26;12;38;-26" dur="1.25s" repeatCount="indefinite"/>
          `
        },
        orbit: {
          bg: "#211527",
          motion: `
            <animateTransform attributeName="transform" type="translate" values="0 0;-100 -52;0 -104;104 -52;0 0" dur="1.8s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 400 225;720 400 225" dur="1.8s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="scale" additive="sum" values=".88;.78;.88;1.05;.88" dur="1.8s" repeatCount="indefinite"/>
          `
        }
      }[preset] || { bg: "#00d5ff", motion: "" };

      return `data:image/svg+xml,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
          <rect width="800" height="450" fill="${style.bg}"/>
          <g opacity=".28" stroke="#fff" stroke-width="10" stroke-linecap="round">
            <path d="M80 110 H280"/>
            <path d="M520 130 H730"/>
            <path d="M100 320 H290"/>
            <path d="M510 300 H700"/>
          </g>
          <g>
            ${style.motion}
            ${preset === "rain" ? "" : `
              <image href="${imageSrc}" x="280" y="105" width="240" height="240" preserveAspectRatio="xMidYMid slice"/>
            `}
          </g>
        </svg>
      `)}`;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    function colorDistance(a, b) {
      return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
    }

    async function removeBackgroundAuto(dataUrl) {
      const img = await loadImage(dataUrl);
      const w = Math.min(960, img.naturalWidth || img.width);
      const h = Math.round(w * ((img.naturalHeight || img.height) / (img.naturalWidth || img.width)));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;

      const corners = [
        [2, 2], [w - 3, 2], [2, h - 3], [w - 3, h - 3]
      ];
      const samples = [];
      corners.forEach(([x, y]) => {
        const i = (y * w + x) * 4;
        samples.push([data[i], data[i + 1], data[i + 2]]);
      });
      const bg = [
        Math.round(samples.reduce((s, c) => s + c[0], 0) / samples.length),
        Math.round(samples.reduce((s, c) => s + c[1], 0) / samples.length),
        Math.round(samples.reduce((s, c) => s + c[2], 0) / samples.length)
      ];

      const visited = new Uint8Array(w * h);
      const queue = [];
      const push = (x, y) => {
        if (x < 0 || y < 0 || x >= w || y >= h) return;
        const id = y * w + x;
        if (visited[id]) return;
        visited[id] = 1;
        queue.push([x, y]);
      };
      corners.forEach(([x, y]) => push(x, y));

      const tolerance = 95;
      while (queue.length) {
        const [x, y] = queue.shift();
        const i = (y * w + x) * 4;
        const current = [data[i], data[i + 1], data[i + 2]];
        if (colorDistance(current, bg) > tolerance) continue;
        data[i + 3] = 0;
        push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1);
      }

      // Soft-edge cleanup
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (data[i + 3] === 0) continue;
          let transparentNeighbors = 0;
          for (let oy = -1; oy <= 1; oy++) {
            for (let ox = -1; ox <= 1; ox++) {
              if (ox === 0 && oy === 0) continue;
              const ni = ((y + oy) * w + (x + ox)) * 4;
              if (data[ni + 3] === 0) transparentNeighbors++;
            }
          }
          if (transparentNeighbors >= 6) data[i + 3] = Math.max(0, data[i + 3] - 110);
        }
      }

      ctx.putImageData(imageData, 0, 0);

      // If too much removed, fallback
      let alphaCount = 0;
      for (let i = 3; i < data.length; i += 4) if (data[i] > 0) alphaCount++;
      const visibleRatio = alphaCount / (w * h);
      if (visibleRatio < 0.05 || visibleRatio > 0.95) return dataUrl;
      return canvas.toDataURL("image/png");
    }

    function updatePreview() {
      if (!sourceImage) return;
      generatedSrc = makeLoopSvg(sourceImage, selectedPreset);
      preview.innerHTML = `<img src="${generatedSrc}" alt="">`;
      statusEl.textContent = `Ready: ${selectedPreset} loop`;
    }

    presets.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedPreset = btn.dataset.preset;
        presets.forEach((item) => item.classList.remove("active"));
        btn.classList.add("active");
        updatePreview();
      });
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        sourceOriginal = reader.result;
        statusEl.textContent = "Detecting fruit and removing background...";
        removeBackgroundAuto(sourceOriginal)
          .then((cutout) => {
            sourceImage = cutout;
            updatePreview();
            statusEl.textContent = "Fruit detected. Background removed.";
          })
          .catch(() => {
            sourceImage = sourceOriginal;
            updatePreview();
            statusEl.textContent = "Auto-cut failed. Using original image.";
          });
      };
      reader.readAsDataURL(file);
    });

    saveLoop.addEventListener("click", () => {
      if (!generatedSrc) {
        statusEl.textContent = "Please upload a fruit drawing first.";
        return;
      }
      let queue = [];
      try {
        queue = JSON.parse(localStorage.getItem("cyj_saved_generated_loops") || "[]");
      } catch (error) {
        queue = [];
      }
      if (!Array.isArray(queue)) queue = [];
      if (queue.length >= 10) {
        statusEl.textContent = "You already have 10 generated loops. Please delete one on Arrange first.";
        return;
      }
      queue.push({
        title: (titleEl.value || "Generated Fruit Loop").trim(),
        note: `Generated ${selectedPreset} motion`,
        duration: 4,
        kind: "visual",
        fileType: "svg",
        src: generatedSrc,
        colors: ["#ff4fa3", "#00d5ff"],
        poster: "linear-gradient(135deg, #ff4fa3, #00d5ff 56%, #fff56a)"
      });
      localStorage.setItem("cyj_saved_generated_loops", JSON.stringify(queue));
      window.location.href = "./index.html";
    });

  </script>
</body>
</html>
