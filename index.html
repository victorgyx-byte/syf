<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Create-your-jam - Timeline Prototype</title>
  <style>
    :root {
      --ink: #211527;
      --muted: rgba(33, 21, 39, .68);
      --quiet: rgba(33, 21, 39, .5);
      --glass: rgba(255, 252, 244, .72);
      --glass-strong: rgba(255, 252, 244, .86);
      --line: rgba(33, 21, 39, .18);
      --cyan: #00d5ff;
      --rose: #ff4fa3;
      --gold: #ffe03d;
      --green: #54f06b;
      --blue: #6267ff;
      --shadow: 0 22px 54px rgba(49, 18, 84, .22);
      --radius: 26px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      letter-spacing: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 86% 16%, rgba(255, 79, 163, .45), transparent 26%),
        radial-gradient(circle at 18% 18%, rgba(0, 213, 255, .46), transparent 28%),
        radial-gradient(circle at 60% 82%, rgba(84, 240, 107, .34), transparent 30%),
        linear-gradient(135deg, #fff56a 0%, #ff8bd2 42%, #72f0ff 100%);
      color: var(--ink);
      user-select: none;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      background-image:
        radial-gradient(circle, rgba(33, 21, 39, .18) 1.5px, transparent 2px),
        linear-gradient(90deg, rgba(33, 21, 39, .1) 1px, transparent 1px);
      background-size: 24px 24px, 96px 96px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .7), transparent 86%);
    }

    button {
      appearance: none;
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(280px, 27vw) 1fr;
      grid-template-rows: minmax(380px, auto) minmax(250px, 34vh);
      gap: 18px;
      width: 100vw;
      height: 100dvh;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .34)) var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(1.18);
    }

    .library {
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      padding: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 4.8rem);
      font-weight: 560;
      line-height: .88;
      letter-spacing: 0;
    }

    .status-pill {
      display: grid;
      min-width: 64px;
      height: 48px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      background: rgba(255, 224, 61, .5);
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
    }

    .section-label {
      margin: 0 0 13px;
      color: var(--quiet);
      font-size: .79rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .import-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 6px 0 10px;
    }

    .import-button {
      display: grid;
      min-height: 42px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 14px;
      background: rgba(255, 255, 255, .42);
      color: var(--ink);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 760;
      padding: 6px 8px;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    a.import-button {
      text-decoration: none;
    }

    .import-button:active,
    .import-button:hover {
      border-color: rgba(255, 255, 255, .3);
      background: rgba(255, 224, 61, .55);
      transform: translateY(-2px);
    }

    #generateLoopsButton {
      background: rgba(0, 213, 255, .8);
      border-color: rgba(0, 213, 255, .95);
      color: #0d1a22;
      box-shadow: 0 10px 20px rgba(0, 213, 255, .28);
    }

    #generateLoopsButton:hover,
    #generateLoopsButton:active {
      background: rgba(0, 213, 255, .95);
      border-color: rgba(0, 213, 255, 1);
    }

    #clearGeneratedLoops {
      background: rgba(255, 79, 163, .76);
      border-color: rgba(255, 79, 163, .95);
      color: #2b1022;
      box-shadow: 0 10px 20px rgba(255, 79, 163, .24);
    }

    #clearGeneratedLoops:hover,
    #clearGeneratedLoops:active {
      background: rgba(255, 79, 163, .9);
      border-color: rgba(255, 79, 163, 1);
    }

    .import-row .import-button:nth-child(3),
    .import-row .import-button:nth-child(4) {
      grid-column: 1 / -1;
    }

    .file-input {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .cards {
      display: grid;
      gap: 16px;
      min-height: 150px;
      overflow: auto;
      padding: 2px 8px 18px 2px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: y proximity;
    }

    .cards + .section-label {
      margin-top: 8px;
    }

    .media-card {
      position: relative;
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 15px;
      min-height: 132px;
      padding: 13px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 24px;
      background: rgba(255, 255, 255, .5);
      box-shadow: 0 16px 36px rgba(0, 0, 0, .24);
      cursor: grab;
      scroll-snap-align: start;
      transition: transform .24s cubic-bezier(.2, .8, .2, 1), background .24s ease, border-color .24s ease;
      touch-action: none;
    }

    .media-card.music-card {
      min-height: 62px;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 16px;
    }

    .music-card .poster {
      display: none;
    }

    .music-card .card-copy {
      gap: 3px;
    }

    .music-card .card-copy strong {
      font-size: .95rem;
      line-height: 1.15;
    }

    .music-card .card-copy span {
      font-size: .82rem;
      line-height: 1.15;
    }

    .media-card:active {
      cursor: grabbing;
    }

    .media-card:hover,
    .media-card.is-lifted {
      border-color: rgba(255, 255, 255, .34);
      background: rgba(255, 255, 255, .72);
      transform: translateY(-3px) scale(1.012);
    }

    .media-card.is-lifted {
      z-index: 30;
      opacity: .92;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .44);
    }

    .delete-generated {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(33, 21, 39, .2);
      background: rgba(255, 255, 255, .86);
      color: rgba(33, 21, 39, .86);
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .poster {
      position: relative;
      min-width: 104px;
      height: 104px;
      overflow: hidden;
      border-radius: 20px;
      background: var(--poster);
    }

    .poster img,
    .poster video {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .poster.has-media::before,
    .poster.has-media::after {
      z-index: 2;
      opacity: .55;
    }

    .poster::before,
    .poster::after {
      position: absolute;
      inset: -25%;
      content: "";
      background:
        repeating-linear-gradient(72deg, rgba(255, 255, 255, .34) 0 3px, transparent 3px 15px),
        radial-gradient(circle at 30% 40%, rgba(255, 255, 255, .44), transparent 24%);
      mix-blend-mode: overlay;
      animation: drift 9s linear infinite;
    }

    .poster::after {
      background: conic-gradient(from 90deg, transparent, rgba(255, 255, 255, .28), transparent, rgba(0, 0, 0, .18), transparent);
      animation-duration: 14s;
      animation-direction: reverse;
    }

    @keyframes drift {
      to {
        transform: translate3d(16%, -12%, 0) rotate(1turn);
      }
    }

    .card-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      padding: 5px 2px;
    }

    .card-copy strong {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 1.32rem;
      font-weight: 580;
      line-height: 1.02;
    }

    .card-copy span {
      color: var(--muted);
      font-size: .93rem;
      line-height: 1.35;
    }

    .duration {
      align-self: start;
      margin-top: 10px;
      color: var(--quiet);
      font-size: .86rem;
    }

    .stage {
      position: relative;
      display: grid;
      width: min(100%, 860px);
      aspect-ratio: 16 / 9;
      min-width: 0;
      min-height: 220px;
      max-height: 56vh;
      margin-inline: auto;
      overflow: hidden;
      place-items: center;
    }

    .monitor-stack {
      display: grid;
      grid-template-rows: auto auto;
      gap: 14px;
      min-width: 0;
      min-height: 0;
      align-items: stretch;
      justify-items: stretch;
      align-content: start;
    }

    .canvas-scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      background: #f7f3ff;
    }

    .stage-media {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    .stage-media.is-visible {
      opacity: .82;
    }

    .stage-slot {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .12s linear;
    }

    .stage-slot.active {
      opacity: 1;
    }

    .stage-slot img,
    .stage-slot video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.08) contrast(1.02);
    }

    .art-layer {
      display: none;
    }

    .stage::after {
      position: absolute;
      inset: 0;
      z-index: 1;
      content: "";
      background: linear-gradient(to bottom, rgba(255, 255, 255, .02), rgba(33, 21, 39, .18));
      pointer-events: none;
    }

    .transport {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 56px;
      grid-template-columns: auto auto auto auto;
      place-items: center;
      gap: 7px;
      padding: 5px 8px;
    }

    .time-readout {
      display: none;
      place-items: center;
      gap: 8px;
      text-align: center;
      text-shadow: 0 6px 28px rgba(0, 0, 0, .54);
    }

    .time-readout .time {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 10vw, 8.7rem);
      font-weight: 500;
      line-height: .85;
      font-variant-numeric: tabular-nums;
    }

    .time-readout .caption {
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.22rem);
    }

    .sync-pill {
      position: static;
      grid-column: 1 / -1;
      justify-self: center;
      min-height: 16px;
      padding: 1px 7px;
      border: 1px solid rgba(33, 21, 39, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .55);
      color: rgba(33, 21, 39, .72);
      font-size: .64rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .sync-pill.ok {
      color: #157347;
      border-color: rgba(21, 115, 71, .32);
    }

    .sync-pill.error {
      color: #a32525;
      border-color: rgba(163, 37, 37, .32);
    }

    .play {
      position: relative;
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: rgba(255, 255, 255, .68);
      box-shadow: 0 16px 36px rgba(49, 18, 84, .2), inset 0 1px 0 rgba(255, 255, 255, .8);
      transition: transform .2s ease, background .2s ease;
    }

    .play:hover,
    .play:active {
      transform: scale(1.04);
      background: rgba(255, 224, 61, .74);
    }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid var(--ink);
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .22));
    }

    .is-playing .play-icon {
      width: 12px;
      height: 16px;
      margin-left: 0;
      border: 0;
      background:
        linear-gradient(to right, var(--ink) 0 4px, transparent 4px 8px, var(--ink) 8px 12px);
    }

    .scrub-ring {
      position: absolute;
      inset: -8px;
      border: 2px solid rgba(255, 255, 255, .13);
      border-radius: inherit;
      pointer-events: none;
    }

    .icon-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 999px;
      background: rgba(255, 255, 255, .52);
      box-shadow: 0 16px 36px rgba(49, 18, 84, .2);
      transition: transform .18s ease, background .18s ease;
    }

    .icon-button:active {
      transform: scale(.95);
      background: rgba(0, 213, 255, .42);
    }

    .icon-button svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .export-button {
      min-width: 54px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      background: rgba(255, 224, 61, .68);
      box-shadow: 0 16px 36px rgba(49, 18, 84, .16);
      color: var(--ink);
      font-size: .78rem;
      font-weight: 850;
    }

    .export-button:disabled {
      opacity: .58;
      cursor: progress;
    }

    .timeline-panel {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 14px 18px 18px;
    }

    .timeline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 46px;
      padding: 0 4px 8px;
    }

    .timeline-head h2 {
      margin: 0;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 2.4vw, 2.25rem);
      font-weight: 540;
      line-height: .94;
    }

    .zoom-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 118px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .48);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .timeline {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 24px;
      background:
        linear-gradient(90deg, rgba(33, 21, 39, .12) 1px, transparent 1px) 0 0 / var(--beat) 100%,
        rgba(255, 255, 255, .38);
      cursor: grab;
      touch-action: none;
    }

    .timeline-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border: 1px solid rgba(33, 21, 39, .16);
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      color: rgba(33, 21, 39, .72);
      font-size: .84rem;
      font-weight: 700;
      pointer-events: none;
      white-space: nowrap;
    }

    .timeline-hint.is-hidden {
      display: none;
    }

    .timeline.is-panning,
    .timeline.is-pinching {
      cursor: grabbing;
    }

    .tracks {
      position: absolute;
      inset: 30px 0 0;
      transform: translateX(calc(var(--pan) * 1px));
      will-change: transform;
    }

    .time-ruler {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9;
      height: 30px;
      transform: translateX(calc(var(--pan) * 1px));
      pointer-events: none;
      will-change: transform;
    }

    .time-tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 100%;
      background: rgba(33, 21, 39, .2);
    }

    .time-tick.major {
      background: rgba(33, 21, 39, .42);
    }

    .time-tick span {
      position: absolute;
      top: 5px;
      left: 8px;
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .58);
      color: rgba(33, 21, 39, .72);
      font-size: .7rem;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .lane {
      position: relative;
      height: 50%;
      min-height: 74px;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
    }

    .lane:last-child {
      border-bottom: 0;
    }

    .lane-label {
      position: absolute;
      left: 16px;
      top: 8px;
      z-index: 0;
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255, 224, 61, .58);
      color: rgba(33, 21, 39, .72);
      font-size: .72rem;
      font-weight: 760;
      letter-spacing: .07em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .clip {
      position: absolute;
      top: 21px;
      z-index: 1;
      display: grid;
      grid-template-columns: 24px 1fr 44px 24px;
      align-items: stretch;
      height: 44px;
      min-width: 96px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 18px;
      background: linear-gradient(130deg, var(--clip-a), var(--clip-b));
      box-shadow: 0 18px 46px rgba(0, 0, 0, .3);
      transform: translateZ(0);
      transition: box-shadow .18s ease, transform .18s ease;
      touch-action: none;
    }

    .clip.is-dragging,
    .clip.is-resizing {
      z-index: 12;
      box-shadow: 0 26px 72px rgba(0, 0, 0, .48);
      transform: scale(1.015);
    }

    .clip-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      pointer-events: none;
    }

    .delete-clip {
      display: grid;
      align-self: center;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 999px;
      background: rgba(0, 0, 0, .2);
      color: rgba(10, 12, 14, .78);
      font-size: 1.1rem;
      font-weight: 760;
      line-height: 1;
      transition: transform .16s ease, background .16s ease;
      touch-action: manipulation;
    }

    .delete-clip:active {
      transform: scale(.92);
      background: rgba(0, 0, 0, .32);
    }

    .clip strong {
      overflow: hidden;
      color: rgba(10, 12, 14, .82);
      font-size: .88rem;
      font-weight: 840;
      line-height: 1.04;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clip small {
      margin-top: 2px;
      color: rgba(10, 12, 14, .58);
      font-size: .7rem;
      font-weight: 740;
      font-variant-numeric: tabular-nums;
    }

    .clip-wave {
      height: 12px;
      margin-top: 4px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .16);
      overflow: hidden;
    }

    .clip-wave svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .clip-wave rect {
      fill: rgba(10, 12, 14, .78);
    }

    .handle {
      position: relative;
      cursor: ew-resize;
      touch-action: none;
    }

    .handle::after {
      position: absolute;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .28);
      content: "";
    }

    .handle.left::after {
      left: 12px;
    }

    .handle.right::after {
      right: 12px;
    }

    .playhead {
      position: absolute;
      top: 30px;
      bottom: 0;
      left: 0;
      z-index: 20;
      width: 3px;
      background: rgba(33, 21, 39, .86);
      box-shadow: 0 0 0 7px rgba(255, 255, 255, .2), 0 0 28px rgba(255, 79, 163, .6);
      transform: translateX(calc(var(--play-x) * 1px));
      pointer-events: none;
    }

    .playhead::before {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: #ff4fa3;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .34);
      content: "";
      transform: translateX(-50%);
    }

      const audios = state.clips.filter((clip) => clip.kind === "audio");
      if (audios.length === 0) return;
      const keep = audios[audios.length - 1];
      keep.lane = 1;
      keep.start = 0;
      if (audios.length > 1) {
        state.clips = state.clips.filter((clip) => clip.kind !== "audio" || clip.id === keep.id);
      }
    }

    function neighborsForClip(clip) {
      const visuals = visualClipsExcept(clip.id);
      return {
        prev: [...visuals].reverse().find((item) => item.start + item.duration <= clip.start),
        next: visuals.find((item) => item.start >= clip.start)
      };
    }

    function findAvailableLoopStart(preferredStart, duration) {
      let start = Math.max(0, preferredStart);
      for (const clip of visualClipsExcept(null)) {
        const clipEnd = clip.start + clip.duration;
        const overlaps = start < clipEnd && start + duration > clip.start;
        if (overlaps) start = clipEnd;
      }
      return snap(start);
    }

    function resolveLoopClipBounds(clip, proposedStart, proposedDuration) {
      if (clip.kind === "audio") {
        return {
          start: clampSeconds(proposedStart),
          duration: Math.max(1, proposedDuration)
        };
      }
      const end = clip.start + clip.duration;
      const prev = visualClipsExcept(clip.id).filter((item) => item.start + item.duration <= clip.start).pop();
      const next = visualClipsExcept(clip.id).find((item) => item.start >= end);
      const minStart = prev ? prev.start + prev.duration : 0;
      const maxEnd = next ? next.start : contentEndSeconds();
      const start = clamp(proposedStart, minStart, Math.max(minStart, maxEnd - 1));
      const duration = clamp(proposedDuration, 1, Math.max(1, maxEnd - start));
      return { start: snap(start), duration: snap(duration) };
    }

    function formatSeconds(value) {
      return value.toFixed(1).padStart(4, "0");
    }

    function formatTimecode(value) {
      const total = Math.max(0, Math.floor(value));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      return [hours, minutes, seconds].map((part) => String(part).padStart(2, "0")).join(":");
    }

    function cleanName(name) {
      return name.replace(/\.[^/.]+$/, "").replace(/[-_]+/g, " ").trim() || "Untitled";
    }

    function slugName(name) {
      return cleanName(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "upload";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (match) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[match]));
    }

    function colorPair(index) {
      const pairs = [
        ["#ff4fa3", "#ffe03d"],
        ["#00d5ff", "#54f06b"],
        ["#6267ff", "#ff4fa3"],
        ["#ffe03d", "#00d5ff"],
        ["#54f06b", "#6267ff"]
      ];
      return pairs[index % pairs.length];
    }

    function posterFor(colors) {
      return `linear-gradient(135deg, #fff56a, ${colors[0]} 48%, ${colors[1]})`;
    }

    function synthPeaks(pattern, points = 48) {
      const peaks = [];
      for (let i = 0; i < points; i++) {
        const t = i / points;
        if (pattern === "action") {
          const pulse = Math.sin(t * Math.PI * 16) * .35 + .55;
          const kick = i % 6 === 0 ? .95 : .4;
          peaks.push(Math.max(.14, Math.min(1, pulse * kick)));
        } else {
          const swell = t < .72 ? .25 + t * .9 : Math.max(.2, 1 - (t - .72) * 2.5);
          const shimmer = .08 + Math.abs(Math.sin(t * Math.PI * 10)) * .2;
          peaks.push(Math.max(.12, Math.min(1, swell * .8 + shimmer)));
        }
      }
      return peaks;
    }

    function peaksToPath(peaks, width = 240, height = 18) {
      if (!peaks?.length) return "";
      const mid = height / 2;
      const step = width / Math.max(1, peaks.length - 1);
      const top = peaks.map((v, i) => `${(i * step).toFixed(2)},${(mid - (v * mid * .9)).toFixed(2)}`).join(" ");
      const bottom = peaks.map((v, i) => `${(i * step).toFixed(2)},${(mid + (v * mid * .9)).toFixed(2)}`).join(" ");
      return `M ${top} M ${bottom}`;
    }

    function peaksToBars(peaks, width = 180, height = 12) {
      if (!peaks?.length) return "";
      const step = width / peaks.length;
      const barWidth = Math.max(.8, step - .6);
      return peaks.map((v, i) => {
        const h = Math.max(1.4, Math.min(height, v * height));
        const y = (height - h) / 2;
        const x = i * step + (step - barWidth) / 2;
        return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barWidth.toFixed(2)}" height="${h.toFixed(2)}" rx=".8" ry=".8"></rect>`;
      }).join("");
    }

    async function decodeWavePeaks(src, points = 56) {
      if (!src) return [];
      const cached = waveformCache.get(src);
      if (cached) return cached;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return [];
        const ctx = state.synth?.ctx || new AudioCtx();
        const response = await fetch(src);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
        const channel = audioBuffer.getChannelData(0);
        const block = Math.max(1, Math.floor(channel.length / points));
        const peaks = new Array(points).fill(.08).map((_, i) => {
          let max = 0;
          const start = i * block;
          const end = Math.min(channel.length, start + block);
          for (let j = start; j < end; j++) {
            const n = Math.abs(channel[j]);
            if (n > max) max = n;
          }
          return Math.max(.08, Math.min(1, max * 1.75));
        });
        waveformCache.set(src, peaks);
        return peaks;
      } catch (error) {
        return [];
      }
    }

    function queueWaveformLoad(clip) {
      if (!clip?.src || clip.pattern || waveformCache.has(clip.src)) return;
      decodeWavePeaks(clip.src).then((peaks) => {
        if (!peaks.length) return;
        renderClips();
      });
    }

    function rasterizeSvgToJpeg(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = 320;
          canvas.height = 180;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", .84));
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    function queueStaticPreview(item) {
      if (!item?.src || item.fileType !== "svg") return;
      if (previewImageCache.has(item.src) || previewPending.has(item.src)) return;
      previewPending.add(item.src);
      rasterizeSvgToJpeg(item.src)
        .then((jpg) => {
          previewImageCache.set(item.src, jpg);
          renderCards();
        })
        .catch(() => {})
        .finally(() => {
          previewPending.delete(item.src);
        });
    }

    function getStaticCardPreview(item) {
      if (!item || item.kind === "audio") return "";
      if (item.fileType === "svg") {
        const cached = previewImageCache.get(item.src);
        if (!cached) queueStaticPreview(item);
        return cached || "";
      }
      if (item.fileType === "image") return item.src || "";
      return "";
    }

    function loadGeneratedLoops() {
      let generated = [];
      try {
        generated = JSON.parse(localStorage.getItem("cyj_saved_generated_loops") || "[]");
      } catch (error) {
        generated = [];
      }
      if (!Array.isArray(generated) || !generated.length) return;
      const seen = new Set();
      generated.forEach((item, index) => {
        if (!item?.src) return;
        if (seen.has(item.src)) return;
        seen.add(item.src);
        const colors = Array.isArray(item.colors) && item.colors.length >= 2 ? item.colors.slice(0, 2) : colorPair(index);
        library.unshift({
          title: item.title || "Generated Loop",
          note: item.note || "Generated from fruit drawing",
          duration: Math.max(1, Number(item.duration) || 4),
          kind: "visual",
          fileType: item.fileType || "svg",
          src: item.src,
          colors,
          poster: item.poster || posterFor(colors),
          generatedTag: true
        });
      });
    }

    function scheduleArrangementSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        const payload = {
          clips: state.clips,
          seconds: state.seconds,
          zoom: state.zoom,
          pan: state.pan
        };
        try {
          localStorage.setItem(ARRANGEMENT_STORAGE_KEY, JSON.stringify(payload));
        } catch (error) {}
      }, 120);
    }

    function loadArrangement() {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(ARRANGEMENT_STORAGE_KEY) || "null");
      } catch (error) {
        saved = null;
      }
      if (!saved || !Array.isArray(saved.clips)) return;
      state.clips = saved.clips
        .filter((clip) => clip && clip.kind && Number.isFinite(Number(clip.start)) && Number.isFinite(Number(clip.duration)))
        .map((clip, idx) => ({
          ...clip,
          id: clip.id || `restored-${idx}-${Date.now()}`,
          lane: laneForKind(clip.kind),
          start: Math.max(0, Number(clip.start)),
          duration: Math.max(1, Number(clip.duration)),
          colors: Array.isArray(clip.colors) && clip.colors.length >= 2 ? clip.colors.slice(0, 2) : colorPair(idx)
        }));
      normalizeAudioTrack();
      state.seconds = Math.max(0, Number(saved.seconds) || 0);
      state.zoom = clamp(Number(saved.zoom) || 1, .55, 2.6);
      state.pan = Number(saved.pan) || 0;
    }

    function setSyncStatus(message, tone = "neutral") {
      if (!syncStatus) return;
      syncStatus.textContent = `Supabase: ${message}`;
      syncStatus.classList.remove("ok", "error");
      if (tone === "ok" || tone === "error") syncStatus.classList.add(tone);
    }

    function setExportStatus(message, tone = "neutral") {
      if (!syncStatus) return;
      syncStatus.textContent = `Export: ${message}`;
      syncStatus.classList.remove("ok", "error");
      if (tone === "ok" || tone === "error") syncStatus.classList.add(tone);
    }

    function renderCards() {
      loopCards.innerHTML = "";
      musicCards.innerHTML = "";
      library.forEach((item, index) => {
        const target = item.kind === "audio" ? musicCards : loopCards;
        const isMusic = item.kind === "audio";
        const card = document.createElement("article");
        card.className = `media-card ${isMusic ? "music-card" : ""}`;
        card.style.setProperty("--poster", item.poster);
        card.dataset.index = index;
        const staticPreview = getStaticCardPreview(item);
        const mediaPreview = staticPreview ? `<img src="${staticPreview}" alt="">` : "";
        const kindLabel = isMusic ? "music" : "loop";
        card.innerHTML = `
          ${isMusic ? "" : `<div class="poster ${mediaPreview ? "has-media" : ""}" aria-hidden="true">${mediaPreview}</div>`}
          <div class="card-copy">
            <strong>${escapeHtml(item.title)}</strong>
            <span>${escapeHtml(item.note)}</span>
            <span class="duration">${item.duration.toFixed(2)}s ${kindLabel}</span>
          </div>
          ${item.generatedTag ? `<button class="delete-generated" type="button" data-delete-generated="${escapeHtml(item.src)}" aria-label="Delete generated loop">×</button>` : ""}
        `;
        card.addEventListener("pointerdown", onCardPointerDown);
        const deleteGeneratedButton = card.querySelector(".delete-generated");
        if (deleteGeneratedButton) {
          deleteGeneratedButton.addEventListener("pointerdown", (event) => event.stopPropagation());
          deleteGeneratedButton.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteGeneratedLoop(item.src);
          });
        }
        target.appendChild(card);
      });
    }

    function deleteGeneratedLoop(src) {
      if (!src) return;
      let generated = [];
      try {
        generated = JSON.parse(localStorage.getItem("cyj_saved_generated_loops") || "[]");
      } catch (error) {
        generated = [];
      }
      const nextGenerated = generated.filter((item) => item?.src !== src);
      localStorage.setItem("cyj_saved_generated_loops", JSON.stringify(nextGenerated));
      state.clips = state.clips.filter((clip) => !(clip.generatedTag && clip.src === src));
      library.splice(0, library.length, ...library.filter((item) => !(item.generatedTag && item.src === src)));
      if (state.currentStageId && !state.clips.some((clip) => clip.id === state.currentStageId)) {
        stageMedia.innerHTML = "";
        stageMedia.classList.remove("is-visible");
        state.currentStageId = null;
      }
      applyTimelineVars();
      renderCards();
      caption.textContent = "Generated loop removed";
    }

    function renderClips() {
      timelineHint?.classList.toggle("is-hidden", state.clips.length > 0);
      tracks.querySelectorAll(".clip").forEach((clip) => clip.remove());
      state.clips.forEach((clip) => {
        const lane = tracks.querySelector(`[data-lane="${clip.lane}"]`);
        let peaks = clip.kind === "audio"
          ? (clip.pattern ? synthPeaks(clip.pattern) : (waveformCache.get(clip.src) || []))
          : [];
        if (clip.kind === "audio" && peaks.length === 0) peaks = synthPeaks("action", 40);
        const waveBars = peaksToBars(peaks, 180, 12);
        const el = document.createElement("div");
        el.className = "clip";
        el.dataset.id = clip.id;
        el.style.left = `${clip.start * pxPerSecond()}px`;
        el.style.width = `${clip.duration * pxPerSecond()}px`;
        el.style.setProperty("--clip-a", clip.colors[0]);
        el.style.setProperty("--clip-b", clip.colors[1]);
        el.innerHTML = `
          ${clip.kind === "audio" ? `<div class="handle left is-locked" aria-hidden="true"></div>` : `<div class="handle left" data-handle="left"></div>`}
          <div class="clip-content">
            <strong>${escapeHtml(clip.title)}</strong>
            ${clip.kind === "audio" ? `<div class="clip-wave"><svg viewBox="0 0 180 12" preserveAspectRatio="none" aria-hidden="true">${waveBars}</svg></div>` : ""}
            <small>${clip.duration.toFixed(2)}s</small>
          </div>
          <button class="delete-clip" type="button" data-delete="${clip.id}" aria-label="Delete ${escapeHtml(clip.title)}">×</button>
          ${clip.kind === "audio" ? `<div class="handle right is-locked" aria-hidden="true"></div>` : `<div class="handle right" data-handle="right"></div>`}
        `;
        el.addEventListener("pointerdown", onClipPointerDown);
        el.querySelector(".delete-clip").addEventListener("pointerdown", (event) => event.stopPropagation());
        el.querySelector(".delete-clip").addEventListener("click", deleteClip);
        lane.appendChild(el);
        if (clip.kind === "audio" && !clip.pattern && clip.src && !waveformCache.has(clip.src)) queueWaveformLoad(clip);
      });
      updatePlayhead();
    }

    function renderRuler() {
      const end = contentEndSeconds();
      const step = state.zoom < .8 ? 10 : state.zoom > 1.7 ? 2 : 5;
      const tickCount = Math.ceil(end / step);
      timeRuler.style.width = `${end * pxPerSecond()}px`;
      timeRuler.innerHTML = "";
      for (let index = 0; index <= tickCount; index++) {
        const seconds = index * step;
        const tick = document.createElement("div");
        tick.className = `time-tick ${seconds % 10 === 0 ? "major" : ""}`;
        tick.style.left = `${seconds * pxPerSecond()}px`;
        tick.innerHTML = `<span>${formatTimecode(seconds)}</span>`;
        timeRuler.appendChild(tick);
      }
    }

    function applyTimelineVars() {
      timeline.style.setProperty("--beat", `${pxPerSecond() * 2}px`);
      clampPan();
      zoom.textContent = `${Math.round(state.zoom * 100)}%`;
      renderRuler();
      renderClips();
      scheduleArrangementSave();
    }

    function updatePlayhead() {
      state.seconds = clampSeconds(state.seconds);
      const playX = secondsToX(state.seconds);
      playhead.style.setProperty("--play-x", playX);
      time.textContent = formatSeconds(state.seconds);
      const active = state.clips.find((clip) => state.seconds >= clip.start && state.seconds <= clip.start + clip.duration);
      caption.textContent = active ? active.title : "Touch the timeline to compose";
      const hue = active ? active.colors[0] : "#ff4fa3";
      stage.style.boxShadow = `var(--shadow), inset 0 0 120px ${hue}26`;
      updateStageMedia();
      syncAudio();
    }

    function updateStageMedia() {
      if (!stageMedia.querySelector(".stage-slot")) {
        stageMedia.innerHTML = `<div class="stage-slot active" data-slot="0"></div><div class="stage-slot" data-slot="1"></div>`;
      }
      const activeVisual = state.clips
        .filter((clip) => clip.kind !== "audio" && clip.src && state.seconds >= clip.start && state.seconds <= clip.start + clip.duration)
        .sort((a, b) => b.lane - a.lane)[0];
      if (!activeVisual) {
        state.currentStageId = null;
        stageMedia.classList.remove("is-visible");
        return;
      }
      if (state.currentStageId !== activeVisual.id) {
        state.currentStageId = activeVisual.id;
        const slots = stageMedia.querySelectorAll(".stage-slot");
        const nextSlot = state.stageSlot === 0 ? 1 : 0;
        const target = slots[nextSlot];
        const swapToTarget = () => {
          slots[state.stageSlot].classList.remove("active");
          target.classList.add("active");
          state.stageSlot = nextSlot;
        };
        if (activeVisual.fileType === "video") {
          target.innerHTML = `<video src="${activeVisual.src}" muted loop playsinline preload="auto"></video>`;
          target.querySelector("video").addEventListener("loadeddata", swapToTarget, { once: true });
        } else {
          target.innerHTML = `<img src="${activeVisual.src}" alt="">`;
          target.querySelector("img").addEventListener("load", swapToTarget, { once: true });
        }
      }
      const activeSlot = stageMedia.querySelector(".stage-slot.active");
      const video = activeSlot?.querySelector("video");
      if (video) {
        const relative = Math.max(0, state.seconds - activeVisual.start);
        if (Math.abs(video.currentTime - relative) > .25) video.currentTime = relative % Math.max(.1, activeVisual.duration);
        if (state.playing) video.play().catch(() => {});
        else video.pause();
      }
      stageMedia.classList.add("is-visible");
    }

    function getSynth() {
      if (!state.synth.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        state.synth.ctx = new AudioCtx();
        state.synth.master = state.synth.ctx.createGain();
        state.synth.master.gain.value = .55;
        state.synth.master.connect(state.synth.ctx.destination);
      }
      return state.synth;
    }

    function stopSynth() {
      if (!state.synth.master) return;
      state.synth.master.gain.cancelScheduledValues(state.synth.ctx.currentTime);
      state.synth.master.gain.setTargetAtTime(0, state.synth.ctx.currentTime, .025);
      state.synth.activeId = null;
      state.synth.scheduled.clear();
      state.synth.lastRelative = 0;
    }

    function playTone(time, freq, dur, gain = .18, type = "sine") {
      const synth = getSynth();
      const osc = synth.ctx.createOscillator();
      const amp = synth.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, time);
      amp.gain.setValueAtTime(0, time);
      amp.gain.linearRampToValueAtTime(gain, time + .015);
      amp.gain.exponentialRampToValueAtTime(.001, time + dur);
      osc.connect(amp).connect(synth.master);
      osc.start(time);
      osc.stop(time + dur + .02);
    }

    function playNoise(time, dur, gain = .18) {
      const synth = getSynth();
      const length = Math.max(1, Math.floor(synth.ctx.sampleRate * dur));
      const buffer = synth.ctx.createBuffer(1, length, synth.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      const source = synth.ctx.createBufferSource();
      const amp = synth.ctx.createGain();
      source.buffer = buffer;
      amp.gain.setValueAtTime(gain, time);
      amp.gain.exponentialRampToValueAtTime(.001, time + dur);
      source.connect(amp).connect(synth.master);
      source.start(time);
    }

    function playEnsembleChord(time, freqs, dur, gain = .1, family = "strings") {
      const voicing = family === "brass"
        ? [{ type: "sawtooth", detune: -4, g: 1 }, { type: "square", detune: 3, g: .75 }]
        : [{ type: "triangle", detune: -6, g: 1 }, { type: "sine", detune: 5, g: .65 }];
      freqs.forEach((freq) => {
        voicing.forEach((voice) => {
          playTone(time, freq, dur, gain * voice.g / freqs.length, voice.type);
        });
      });
    }

    function scheduleSynthClip(clip, relative) {
      const synth = getSynth();
      if (synth.ctx.state === "suspended") synth.ctx.resume();
      if (synth.activeId !== clip.id) {
        stopSynth();
        synth.activeId = clip.id;
        synth.master.gain.setTargetAtTime(.55, synth.ctx.currentTime, .02);
      }
      if (relative + .2 < synth.lastRelative) {
        synth.scheduled.clear();
      }
      synth.lastRelative = relative;
      const lookAhead = .45;
      const step = clip.pattern === "action" ? .25 : .25;
      const startStep = Math.floor(relative / step);
      const endStep = Math.ceil((relative + lookAhead) / step);
      const risingLead = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
      const actionLead = [220, 246.94, 293.66, 329.63, 293.66, 246.94, 392, 440];
      const chordMap = {
        C: [130.81, 164.81, 196],
        Dm: [146.83, 174.61, 220],
        Em: [164.81, 196, 246.94],
        F: [174.61, 220, 261.63],
        G: [196, 246.94, 293.66],
        Am: [220, 261.63, 329.63]
      };
      const risingProg = ["Am", "F", "C", "G", "Am", "F", "Dm", "G"];
      const actionProg = ["Am", "G", "F", "G", "Am", "Em", "F", "G"];
      for (let i = startStep; i <= endStep; i++) {
        const eventTime = i * step;
        if (eventTime < 0 || eventTime > clip.duration) continue;
        const key = `${clip.id}:${i}`;
        if (synth.scheduled.has(key)) continue;
        synth.scheduled.add(key);
        const when = synth.ctx.currentTime + Math.max(0, eventTime - relative);
        const ramp = clip.pattern === "action"
          ? (eventTime < 20 ? .65 + eventTime / 20 * .35 : Math.max(.42, 1 - (eventTime - 20) / 10 * .58))
          : (eventTime < 8 ? .45 + eventTime / 8 * .35 : eventTime < 22 ? .8 + (eventTime - 8) / 14 * .2 : Math.max(.4, 1 - (eventTime - 22) / 8 * .6));
        if (i % 8 === 0) {
          const prog = clip.pattern === "action" ? actionProg : risingProg;
          const chordName = prog[Math.floor(i / 8) % prog.length];
          const chord = chordMap[chordName] || chordMap.C;
          playEnsembleChord(when, chord, .92, .2 * ramp, "strings");
          playEnsembleChord(when + .02, chord.map((f) => f * 2), .5, .12 * ramp, "brass");
          playTone(when, chord[0] / 2, .78, .18 * ramp, "sine");
        }
        const lead = clip.pattern === "action" ? actionLead : risingLead;
        if (i % 2 === 0) playTone(when, lead[(i + Math.floor(i / 8)) % lead.length], .22, .08 * ramp, clip.pattern === "action" ? "square" : "triangle");
        if (i % 4 === 2) playTone(when, lead[(i + 3) % lead.length] * 2, .16, .05 * ramp, "sine");
        if (i % 4 === 0) playNoise(when, .06, (.04 + .02 * ramp) * (clip.pattern === "action" ? 1.6 : 1));
        if (i % 8 === 4) playNoise(when, .12, (.08 + .04 * ramp) * (clip.pattern === "action" ? 1.7 : 1.1));
      }
    }

    function syncAudio() {
      const activeAudio = state.clips.find((clip) => clip.kind === "audio" && state.seconds >= clip.start && state.seconds <= clip.start + clip.duration);
      if (!activeAudio) {
        state.currentAudioId = null;
        audioPlayer.pause();
        stopSynth();
        return;
      }
      const relative = Math.max(0, state.seconds - activeAudio.start);
      if (activeAudio.pattern) {
        audioPlayer.pause();
        if (state.playing) scheduleSynthClip(activeAudio, relative);
        else stopSynth();
        return;
      }
      stopSynth();
      if (state.currentAudioId !== activeAudio.id) {
        state.currentAudioId = activeAudio.id;
        audioPlayer.src = activeAudio.src;
      }
      if (Math.abs(audioPlayer.currentTime - relative) > .25) {
        audioPlayer.currentTime = Math.min(relative, Math.max(.1, activeAudio.duration - .05));
      }
      if (state.playing) audioPlayer.play().catch(() => {});
      else audioPlayer.pause();
    }

    function setStageSvgPlayback(playing) {
      return;
    }

    function showSnap(clientX, visible) {
      snapLine.style.setProperty("--snap-x", clientX - timelineRect().left);
      snapLine.classList.toggle("is-visible", visible);
    }

    function onCardPointerDown(event) {
      if (event.button !== 0 && event.pointerType === "mouse") return;
      const card = event.currentTarget;
      const item = library[Number(card.dataset.index)];
      card.setPointerCapture(event.pointerId);
      card.classList.add("is-lifted");
      const ghost = document.createElement("div");
      ghost.className = "ghost";
      ghost.style.setProperty("--clip-a", item.colors[0]);
      ghost.style.setProperty("--clip-b", item.colors[1]);
      document.body.appendChild(ghost);
      state.cardDrag = { card, item, ghost, id: event.pointerId };
      moveGhost(event.clientX, event.clientY);
      window.addEventListener("pointermove", onCardPointerMove);
      window.addEventListener("pointerup", onCardPointerUp, { once: true });
      window.addEventListener("pointercancel", onCardPointerUp, { once: true });
    }

    function moveGhost(x, y) {
      if (!state.cardDrag) return;
      state.cardDrag.ghost.style.left = `${x}px`;
      state.cardDrag.ghost.style.top = `${y}px`;
      dropSignal.style.left = `${x + 20}px`;
      dropSignal.style.top = `${y + 34}px`;
    }

    function onCardPointerMove(event) {
      if (!state.cardDrag || event.pointerId !== state.cardDrag.id) return;
      moveGhost(event.clientX, event.clientY);
      const rect = timelineRect();
      const over = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
      dropSignal.classList.toggle("is-visible", over);
      showSnap(event.clientX, over);
    }

    function onCardPointerUp(event) {
      if (!state.cardDrag) return;
      const { card, item, ghost } = state.cardDrag;
      const rect = timelineRect();
      const over = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
      if (over) {
        const preferredStart = snap(xToSeconds(event.clientX));
        const start = item.kind === "audio" ? 0 : findAvailableLoopStart(preferredStart, item.duration);
        if (item.kind === "audio") {
          state.clips = state.clips.filter((clip) => clip.kind !== "audio");
        }
        state.clips.push({
          id: `c${Date.now()}`,
          title: item.title,
          kind: item.kind,
          lane: laneForKind(item.kind),
          start,
          duration: item.duration,
          colors: item.colors,
          src: item.src,
          fileType: item.fileType,
          pattern: item.pattern,
          generatedTag: !!item.generatedTag
        });
        normalizeAudioTrack();
        state.seconds = start;
        pulse(stage);
        applyTimelineVars();
      }
      card.classList.remove("is-lifted");
      ghost.remove();
      dropSignal.classList.remove("is-visible");
      showSnap(0, false);
      state.cardDrag = null;
      window.removeEventListener("pointermove", onCardPointerMove);
    }

    function deleteClip(event) {
      event.stopPropagation();
      const id = event.currentTarget.dataset.delete;
      const clip = state.clips.find((item) => item.id === id);
      state.clips = state.clips.filter((item) => item.id !== id);
      if (clip?.kind === "audio" && state.currentAudioId === id) {
        audioPlayer.pause();
        state.currentAudioId = null;
        stopSynth();
      }
      if (state.currentStageId === id) {
        stageMedia.classList.remove("is-visible");
        state.currentStageId = null;
      }
      state.seconds = clampSeconds(state.seconds);
      applyTimelineVars();
      pulse(timeline);
    }

    function onClipPointerDown(event) {
      if (event.button !== 0 && event.pointerType === "mouse") return;
      event.stopPropagation();
      const el = event.currentTarget;
      const clip = state.clips.find((item) => item.id === el.dataset.id);
      if (!clip || clip.kind === "audio") return;
      const handle = event.target.dataset.handle || "move";
      el.setPointerCapture(event.pointerId);
      el.classList.add(handle === "move" ? "is-dragging" : "is-resizing");
      state.activeDrag = {
        id: event.pointerId,
        el,
        clip,
        handle,
        originX: event.clientX,
        originY: event.clientY,
        start: clip.start,
        duration: clip.duration,
        lane: clip.lane
      };
      window.addEventListener("pointermove", onClipPointerMove);
      window.addEventListener("pointerup", onClipPointerUp, { once: true });
      window.addEventListener("pointercancel", onClipPointerUp, { once: true });
    }

    function onClipPointerMove(event) {
      const drag = state.activeDrag;
      if (!drag || event.pointerId !== drag.id) return;
      const deltaSeconds = (event.clientX - drag.originX) / pxPerSecond();
      if (drag.handle === "left") {
        const nextStart = snap(Math.max(0, drag.start + deltaSeconds));
        const end = drag.start + drag.duration;
        const resolved = resolveLoopClipBounds(drag.clip, Math.min(nextStart, end - 1), Math.max(1, end - Math.min(nextStart, end - 1)));
        drag.clip.start = resolved.start;
        drag.clip.duration = resolved.duration;
      } else if (drag.handle === "right") {
        const resolved = resolveLoopClipBounds(drag.clip, drag.start, Math.max(1, snap(drag.duration + deltaSeconds)));
        drag.clip.start = resolved.start;
        drag.clip.duration = resolved.duration;
      } else {
        const resolved = resolveLoopClipBounds(drag.clip, snap(Math.max(0, drag.start + deltaSeconds)), drag.duration);
        drag.clip.start = resolved.start;
        drag.clip.duration = resolved.duration;
        drag.clip.lane = laneForKind(drag.clip.kind);
      }
      state.seconds = drag.clip.start;
      showSnap(secondsToX(drag.clip.start) + timelineRect().left, true);
      applyTimelineVars();
      const refreshed = tracks.querySelector(`[data-id="${drag.clip.id}"]`);
      if (refreshed) {
        refreshed.classList.add(drag.handle === "move" ? "is-dragging" : "is-resizing");
        state.activeDrag.el = refreshed;
      }
    }

    function onClipPointerUp() {
      if (state.activeDrag?.el) {
        state.activeDrag.el.classList.remove("is-dragging", "is-resizing");
      }
      showSnap(0, false);
      state.activeDrag = null;
      window.removeEventListener("pointermove", onClipPointerMove);
    }

    timeline.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".clip")) return;
      timeline.setPointerCapture(event.pointerId);
      state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (state.pointers.size === 1) {
        state.panStart = state.pan;
        state.touchStart = { x: event.clientX, y: event.clientY };
        state.seconds = xToSeconds(event.clientX);
        updatePlayhead();
      }
      if (state.pointers.size === 2) {
        const points = [...state.pointers.values()];
        state.pinchStartDistance = Math.abs(points[0].x - points[1].x) || 1;
        state.zoomStart = state.zoom;
        timeline.classList.add("is-pinching");
      } else {
        timeline.classList.add("is-panning");
      }
    });

    timeline.addEventListener("pointermove", (event) => {
      if (!state.pointers.has(event.pointerId)) return;
      state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (state.pointers.size === 2) {
        const points = [...state.pointers.values()];
        const distance = Math.abs(points[0].x - points[1].x) || 1;
        state.zoom = Math.min(2.6, Math.max(.55, state.zoomStart * (distance / state.pinchStartDistance)));
        applyTimelineVars();
        return;
      }
      const dx = event.clientX - state.touchStart.x;
      const dy = event.clientY - state.touchStart.y;
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
        clampPan(state.panStart + dx);
        timeline.classList.add("is-panning");
        updatePlayhead();
      } else {
        state.seconds = xToSeconds(event.clientX);
        updatePlayhead();
      }
    });

    function clearTimelinePointer(event) {
      state.pointers.delete(event.pointerId);
      if (state.pointers.size === 0) {
        timeline.classList.remove("is-panning", "is-pinching");
      }
    }

    timeline.addEventListener("pointerup", clearTimelinePointer);
    timeline.addEventListener("pointercancel", clearTimelinePointer);

    timeline.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && Math.abs(event.deltaX) < Math.abs(event.deltaY)) return;
      event.preventDefault();
      if (event.ctrlKey) {
        state.zoom = Math.min(2.6, Math.max(.55, state.zoom - event.deltaY * .002));
        applyTimelineVars();
      } else {
        clampPan(state.pan - event.deltaX);
        updatePlayhead();
      }
    }, { passive: false });

    function durationForFile(file, src) {
      return new Promise((resolve) => {
        if (file.type.startsWith("image/")) {
          resolve(6);
          return;
        }
        const media = document.createElement(file.type.startsWith("audio/") ? "audio" : "video");
        media.preload = "metadata";
        media.src = src;
        media.onloadedmetadata = () => resolve(Number.isFinite(media.duration) ? Math.min(media.duration, 90) : 8);
        media.onerror = () => resolve(8);
      });
    }

    async function addFiles(files, kind) {
      for (const file of files) {
        const colors = colorPair(library.length);
        const objectUrl = URL.createObjectURL(file);
        const duration = await durationForFile(file, objectUrl);
        const fileType = file.type.startsWith("audio/") ? "audio" : file.type.startsWith("image/") ? "image" : "video";
        const baseItem = {
          title: cleanName(file.name),
          note: kind === "audio" ? "Imported music" : "Imported visual loop",
          duration: Math.max(1, duration),
          kind,
          fileType,
          colors,
          poster: posterFor(colors)
        };

        if (supabaseClient) {
          try {
            const ext = (file.name.split(".").pop() || "bin").toLowerCase();
            const path = `${kind}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${slugName(file.name)}.${ext}`;
            const { error: uploadError } = await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path, file, { upsert: false });
            if (uploadError) throw uploadError;
            const { data: publicData } = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
            const publicUrl = publicData?.publicUrl;
            if (!publicUrl) throw new Error("No public URL returned.");
            const row = {
              title: baseItem.title,
              note: baseItem.note,
              kind: baseItem.kind,
              file_type: baseItem.fileType,
              duration: baseItem.duration,
              src: publicUrl,
              poster: baseItem.poster,
              colors: baseItem.colors
            };
            const { data: inserted, error: insertError } = await supabaseClient
              .from(SUPABASE_TABLE)
              .insert(row)
              .select()
              .single();
            if (insertError) throw insertError;
            library.unshift({ ...baseItem, src: publicUrl, remoteId: inserted?.id ?? null });
            URL.revokeObjectURL(objectUrl);
            setSyncStatus("upload saved to shared library", "ok");
          } catch (error) {
            console.warn("Supabase upload failed, using local file only:", error);
            library.unshift({ ...baseItem, src: objectUrl });
            const message = String(error?.message || "");
            if (message.toLowerCase().includes("row-level security")) {
              setSyncStatus("upload blocked by table policy", "error");
            } else if (message.toLowerCase().includes("bucket")) {
              setSyncStatus("upload blocked by storage bucket settings", "error");
            } else {
              setSyncStatus("upload failed, using local file only", "error");
            }
          }
        } else {
          library.unshift({ ...baseItem, src: objectUrl });
          setSyncStatus("not connected (using local files only)");
        }
      }
      renderCards();
      caption.textContent = kind === "audio" ? "Music is ready for the Music track" : "Loop is ready to arrange";
      pulse(kind === "audio" ? musicCards : loopCards);
    }

    async function loadSharedLibrary() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient
        .from(SUPABASE_TABLE)
        .select("id,title,note,kind,file_type,duration,src,poster,colors")
        .order("id", { ascending: false })
        .limit(120);
      if (error) {
        console.warn("Could not load shared library:", error);
        const message = String(error?.message || "");
        if (message.toLowerCase().includes("row-level security")) {
          setSyncStatus("read blocked by table policy", "error");
        } else {
          setSyncStatus("read failed (check table or key)", "error");
        }
        return;
      }
      for (const item of data || []) {
        if (!item?.src || !item?.kind) continue;
        const colors = Array.isArray(item.colors) && item.colors.length >= 2 ? item.colors.slice(0, 2) : colorPair(library.length);
        library.push({
          title: item.title || "Untitled",
          note: item.note || (item.kind === "audio" ? "Imported music" : "Imported visual loop"),
          duration: Math.max(1, Number(item.duration) || 6),
          kind: item.kind,
          fileType: item.file_type || (item.kind === "audio" ? "audio" : "video"),
          src: item.src,
          colors,
          poster: item.poster || posterFor(colors),
          remoteId: item.id
        });
      }
    }

    loopUpload.addEventListener("change", async (event) => {
      await addFiles([...event.target.files], "visual");
      loopUpload.value = "";
    });

    musicUpload.addEventListener("change", async (event) => {
      await addFiles([...event.target.files], "audio");
      musicUpload.value = "";
    });

    function setPlayback(playing) {
      state.playing = playing;
      document.body.classList.toggle("is-playing", state.playing);
      play.setAttribute("aria-label", state.playing ? "Pause" : "Play");
      state.lastFrame = 0;
      if (state.playing) {
        syncAudio();
        setStageSvgPlayback(true);
        requestAnimationFrame(tick);
      } else {
        audioPlayer.pause();
        stopSynth();
        stageMedia.querySelector("video")?.pause();
        setStageSvgPlayback(false);
      }
    }

    play.addEventListener("click", (event) => {
      event.stopPropagation();
      setPlayback(!state.playing);
      pulse(play);
    });

    document.getElementById("timelineHome").addEventListener("click", () => {
      state.seconds = 0;
      clampPan(0);
      updatePlayhead();
      pulse(timeline);
    });

    document.getElementById("clearTimeline").addEventListener("click", () => {
      state.clips = [];
      state.seconds = 0;
      state.currentAudioId = null;
      state.currentStageId = null;
      audioPlayer.pause();
      stopSynth();
      stageMedia.innerHTML = "";
      stageMedia.classList.remove("is-visible");
      applyTimelineVars();
      caption.textContent = "Timeline cleared";
      pulse(timeline);
    });

    document.getElementById("clearGeneratedLoops").addEventListener("click", () => {
      localStorage.removeItem("cyj_saved_generated_loops");
      library.splice(0, library.length, ...library.filter((item) => !item.generatedTag));
      const removedIds = new Set(state.clips.filter((clip) => clip.generatedTag).map((clip) => clip.id));
      state.clips = state.clips.filter((clip) => !clip.generatedTag);
      if (removedIds.has(state.currentStageId)) {
        stageMedia.innerHTML = "";
        stageMedia.classList.remove("is-visible");
        state.currentStageId = null;
      }
      if (removedIds.has(state.currentAudioId)) {
        audioPlayer.pause();
        stopSynth();
        state.currentAudioId = null;
      }
      renderCards();
      applyTimelineVars();
      caption.textContent = "Generated loops cleared";
      pulse(loopCards);
    });

    function buildExportPayload() {
      const duration = Math.min(60, Math.max(1, ...state.clips.map((clip) => clip.start + clip.duration)));
      const exportSrc = (src) => {
        if (!src || src.startsWith("data:") || src.startsWith("blob:") || /^https?:\/\//i.test(src)) return src || "";
        return new URL(src, window.location.href).href;
      };
      return {
        title: "Create your jam",
        width: 640,
        height: 360,
        fps: 12,
        duration,
        background: "#f7f3ff",
        clips: state.clips.map((clip) => ({
          id: clip.id,
          title: clip.title,
          kind: clip.kind,
          start: Math.max(0, Number(clip.start) || 0),
          duration: Math.max(1, Number(clip.duration) || 1),
          src: exportSrc(clip.src),
          fileType: clip.fileType || "",
          pattern: clip.pattern || "",
          colors: Array.isArray(clip.colors) ? clip.colors.slice(0, 2) : colorPair(0)
        }))
      };
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function getExportApiUrl() {
      let url = EXPORT_API_URL || localStorage.getItem("cyj_export_api_url") || "";
      if (!url) {
        url = window.prompt("Paste your Google Cloud Run export URL");
        if (url) localStorage.setItem("cyj_export_api_url", url);
      } else if (EXPORT_API_URL) {
        localStorage.setItem("cyj_export_api_url", EXPORT_API_URL);
      }
      return String(url || "").replace(/\/+$/, "");
    }

    async function exportArrangementMp4() {
      if (!state.clips.length) {
        caption.textContent = "Add loops or music before exporting";
        setExportStatus("add loops or music first", "error");
        exportMp4.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 260 });
        return;
      }
      const localClip = state.clips.find((clip) => String(clip.src || "").startsWith("blob:"));
      if (localClip) {
        caption.textContent = "Upload local files to the shared library before MP4 export";
        setExportStatus("upload local files to shared library first", "error");
        exportMp4.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 260 });
        return;
      }
      const audioClip = state.clips.find((clip) => clip.kind === "audio");
      if (!audioClip) {
        caption.textContent = "Add music before exporting MP4";
        setExportStatus("add music to timeline first", "error");
        exportMp4.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 260 });
        return;
      }
      const exportUrl = getExportApiUrl();
      if (!exportUrl) {
        caption.textContent = "Cloud Run export URL needed";
        setExportStatus("Cloud Run URL needed", "error");
        return;
      }
      const payload = buildExportPayload();
      exportMp4.disabled = true;
      exportMp4.textContent = "Exporting...";
      caption.textContent = "Rendering MP4...";
      setExportStatus(`rendering MP4 with ${audioClip.title || "music"}...`);
      try {
        const response = await fetch(`${exportUrl}/export`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          const message = await response.text();
          throw new Error(message || `Export failed with ${response.status}`);
        }
        const blob = await response.blob();
        downloadBlob(blob, `create-your-jam-${Date.now()}.mp4`);
        caption.textContent = "MP4 ready";
        setExportStatus("MP4 downloaded", "ok");
      } catch (error) {
        console.error("MP4 export failed:", error);
        caption.textContent = "MP4 export failed";
        setExportStatus("failed - check Cloud Run", "error");
      } finally {
        exportMp4.disabled = false;
        exportMp4.textContent = "Export MP4";
      }
    }

    exportMp4.addEventListener("click", exportArrangementMp4);

    function tick(now) {
      if (!state.playing) return;
      const delta = state.lastFrame ? (now - state.lastFrame) / 1000 : 0;
      state.lastFrame = now;
      const end = Math.max(18, ...state.clips.map((clip) => clip.start + clip.duration));
      state.seconds = (state.seconds + delta) % end;
      updatePlayhead();
      requestAnimationFrame(tick);
    }

    function pulse(element) {
      element.animate([
        { transform: "scale(1)" },
        { transform: "scale(1.012)" },
        { transform: "scale(1)" }
      ], { duration: 280, easing: "cubic-bezier(.2,.8,.2,1)" });
    }

    window.addEventListener("resize", () => {
      applyTimelineVars();
      updatePlayhead();
    });

    async function boot() {
      loadArrangement();
      if (!initSupabase()) {
        setSyncStatus("not connected (add project URL + anon key)");
      } else {
        setSyncStatus("connected", "ok");
      }
      await loadSharedLibrary();
      loadGeneratedLoops();
      renderCards();
      applyTimelineVars();
      if (supabaseClient) caption.textContent = "Shared library is connected";
    }

    boot();
  </script>
</body>
</html>
